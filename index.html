
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0d">
<title>LQA GALLERY</title>
<style>
:root {
  --red: #ff2638;
  --bg: #09090c;
  --panel: #151519;
  --muted: #a5a5b0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
}
header {
  padding: 25px 6%;
  border-bottom: 1px solid #29292f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}
.logo span { color: var(--red); }
.tag {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2px;
}
.hero {
  padding: 65px 6% 38px;
  background: radial-gradient(ellipse at 80% 0%, #491018 0%, #171014 30%, var(--bg) 72%);
}
.hero small {
  color: var(--red);
  font-weight: bold;
  letter-spacing: 3px;
}
h1 {
  font-size: clamp(34px, 7vw, 66px);
  line-height: 1;
  margin: 18px 0;
  font-weight: 900;
}
h1 span { color: var(--red); }
.hero p { color: var(--muted); }
main { padding: 25px 6% 65px; }
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0 28px;
}
button, input {
  font: inherit;
}
.filter {
  color: #ddd;
  background: var(--panel);
  border: 1px solid #303037;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
}
.filter.active, .filter:hover {
  background: var(--red);
  color: white;
  border-color: var(--red);
}
#search {
  min-width: 150px;
  flex: 1;
  color: white;
  background: var(--panel);
  border: 1px solid #303037;
  padding: 12px;
  border-radius: 6px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
}
.section-title h2 { font-size: 20px; }
.section-title span { color: var(--muted); font-size: 13px; }
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.item {
  background: var(--panel);
  border: 1px solid #29292f;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
}
.item:hover {
  transform: translateY(-3px);
  border-color: var(--red);
}
.item img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #202026;
}
.info { padding: 12px; }
.info strong { display: block; font-size: 14px; }
.info small {
  display: block;
  margin-top: 6px;
  color: var(--red);
  font-size: 10px;
  letter-spacing: 1px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 40px 0;
  grid-column: 1 / -1;
}
footer {
  border-top: 1px solid #29292f;
  padding: 25px 6%;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
#viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  background: rgba(0,0,0,.94);
  align-items: center;
  justify-content: center;
  padding: 18px;
}
#viewer.open { display: flex; }
#viewer img {
  max-width: 100%;
  max-height: 82vh;
  object-fit: contain;
}
#close {
  position: absolute;
  top: 15px;
  right: 20px;
  color: white;
  background: #29292f;
  border: 0;
  border-radius: 6px;
  padding: 12px 16px;
  cursor: pointer;
}
@media (min-width: 650px) {
  .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
}
@media (min-width: 1000px) {
  .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header>
  <div class="logo">LQA<span>.</span>GALLERY</div>
  <div class="tag">GAMING CREATIVE</div>
</header>

<section class="hero">
  <small>YOUR VISUAL COLLECTION</small>
  <h1>MY <span>GALLERY</span></h1>
  <p>All your designs. One destination.</p>
</section>

<main>
  <div class="toolbar" id="filters">
    <button class="filter active" data-cat="all">Tất cả</button>
    <button class="filter" data-cat="banner">Banner</button>
    <button class="filter" data-cat="profile">Profile</button>
    <button class="filter" data-cat="lineup">Lineup</button>
    <input id="search" type="search" placeholder="Tìm ảnh...">
  </div>

  <div class="section-title">
    <h2>THƯ VIỆN ẢNH</h2>
    <span id="count"></span>
  </div>
  <div class="gallery" id="gallery"></div>
</main>

<footer>© 2026 LQA GALLERY · DESIGNED FOR GAMERS</footer>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Xem ảnh lớn">
  <button id="close" aria-label="Đóng ảnh">ĐÓNG ✕</button>
  <img id="large" alt="Ảnh đang xem">
</div>

<script>
// THÊM ẢNH CỦA BẠN TẠI ĐÂY
// Tải ảnh vào thư mục photos trong repository.
// category: banner, profile hoặc lineup.

const photos = [
  { title: "Banner 01", category: "banner", src: "photos/banner1.jpg" },
  { title: "Profile 01", category: "profile", src: "photos/profile1.jpg" },
  { title: "Lineup 01", category: "lineup", src: "photos/lineup1.jpg" }
];

const gallery = document.getElementById("gallery");
const count = document.getElementById("count");
const search = document.getElementById("search");
let category = "all";

function render() {
  const filtered = photos.filter(p =>
    (category === "all" || p.category === category) &&
    p.title.toLowerCase().includes(search.value.toLowerCase())
  );

  gallery.innerHTML = "";
  count.textContent = filtered.length + " ẢNH";

  if (!filtered.length) {
    gallery.innerHTML =
      '<div class="empty">Chưa có ảnh phù hợp.</div>';
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement("article");
    card.className = "item";

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.title;
    img.loading = "lazy";

    img.onerror = () => {
      img.alt = "Chưa tìm thấy ảnh: " + p.src;
      img.style.opacity = ".25";
    };

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("strong");
    title.textContent = p.title;

    const label = document.createElement("small");
    label.textContent = p.category.toUpperCase();

    info.append(title, label);
    card.append(img, info);

    card.addEventListener("click", () => {
      document.getElementById("large").src = p.src;
      document.getElementById("viewer").classList.add("open");
    });

    gallery.appendChild(card);
  });
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.remove("active")
    );
    btn.classList.add("active");
    category = btn.dataset.cat;
    render();
  });
});

search.addEventListener("input", render);

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("viewer").classList.remove("open");
});

document.getElementById("viewer").addEventListener("click", e => {
  if (e.target.id === "viewer")
    e.currentTarget.classList.remove("open");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape")
    document.getElementById("viewer").classList.remove("open");
});

render();
</script>
</body>
</html>
